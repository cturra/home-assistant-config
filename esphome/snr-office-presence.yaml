esphome:
  name: "snr-office-presence"

esp8266:
  board: esp12e

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Disables the power-saving sleep cycle to keep a rock-solid connection
  power_save_mode: NONE  

# Keeps the network communication engine active for Home Assistant
api:

# Keeps the OTA wireless update portal open
ota:
  - platform: esphome

# Silences the serial pins completely to stop the Tuya MCU traffic jam
logger:
  baud_rate: 0
  level: NONE